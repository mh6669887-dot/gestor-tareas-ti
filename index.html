<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas TI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#2563eb"/>
          <rect x="12" y="14" width="24" height="4" rx="2" fill="white"/>
          <rect x="12" y="22" width="18" height="4" rx="2" fill="white" opacity="0.7"/>
          <rect x="12" y="30" width="20" height="4" rx="2" fill="white" opacity="0.7"/>
          <circle cx="36" cy="34" r="8" fill="#16a34a"/>
          <path d="M32 34l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Gestor de Tareas</h1>
      <p class="login-subtitle">para Pequeños Proyectos TI</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="Ingresa tu usuario" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
        </div>
        <p id="loginError" class="login-error hidden">Usuario o contraseña incorrectos.</p>
        <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
      </form>

      <p class="login-footer">Grupo 4 · Universidad de la Costa – CUC</p>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
